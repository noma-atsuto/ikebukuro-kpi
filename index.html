<title>池袋店スタイリスト分析</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#f7f6f2; --surface:#ffffff; --surface2:#faf9f5;
  --ink:#191a1d; --ink2:#5c5a52; --ink3:#8b8981;
  --line:#e4e1d8; --line2:#efece4;
  --accent:#2d4a7c; --accent-soft:#e7edf7;
  --good:#1a7a58; --good-soft:#e2f2ea;
  --warn:#b1412f; --warn-soft:#fbe9e5;
  --caution:#8d6205; --caution-soft:#f9f0d8;
  --sans:"IBM Plex Sans","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#131418; --surface:#1b1d22; --surface2:#21242b;
  --ink:#f1f0ea; --ink2:#a5a39a; --ink3:#7a7871;
  --line:#2d3038; --line2:#24272e;
  --accent:#8fb0e8; --accent-soft:#1c2637;
  --good:#5cc79c; --good-soft:#12291f;
  --warn:#ed8b7d; --warn-soft:#2e1a17;
  --caution:#d9a83f; --caution-soft:#2a2211;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#131418; --surface:#1b1d22; --surface2:#21242b;
  --ink:#f1f0ea; --ink2:#a5a39a; --ink3:#7a7871;
  --line:#2d3038; --line2:#24272e;
  --accent:#8fb0e8; --accent-soft:#1c2637;
  --good:#5cc79c; --good-soft:#12291f;
  --warn:#ed8b7d; --warn-soft:#2e1a17;
  --caution:#d9a83f; --caution-soft:#2a2211;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);margin:0;
  font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%;
  font-feature-settings:"palt" 1}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 72px}

/* ---- 上部固定バー ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);
  border-bottom:1px solid var(--line);margin-inline:-16px;padding:12px 16px 0}
.brand{font-size:11px;letter-spacing:.09em;color:var(--ink3);text-transform:none;margin:0 0 1px}
.top h1{font-size:19px;margin:0;letter-spacing:-.01em;font-weight:700;text-wrap:balance}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
select{font:inherit;font-size:14px;font-weight:500;padding:8px 30px 8px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:40px;
  appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
  linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 16px) 18px,calc(100% - 11px) 18px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.seg{display:flex;gap:2px;background:var(--line2);border-radius:11px;padding:3px;margin:10px 0 0;
  overflow-x:auto;-webkit-overflow-scrolling:touch}
.seg button{font:inherit;font-size:13.5px;font-weight:600;padding:8px 15px;border:0;border-radius:9px;
  background:none;color:var(--ink2);cursor:pointer;white-space:nowrap;min-height:38px}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--accent);
  box-shadow:0 1px 3px rgba(0,0,0,.09)}
.seg button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.topspace{height:12px}

/* ---- 主要数字 ---- */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:16px}
.hero .lab{font-size:12px;color:var(--ink2);font-weight:600;letter-spacing:.03em}
.hero .big{font-size:clamp(30px,8vw,42px);font-weight:700;letter-spacing:-.025em;line-height:1.15;
  font-variant-numeric:tabular-nums;margin-top:2px}
.hero .sub{font-size:13px;color:var(--ink2);margin-top:2px}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:12px}
.strip div{background:var(--surface);padding:13px 12px}
.strip .k{font-size:11.5px;color:var(--ink2);font-weight:600}
.strip .v{font-size:clamp(17px,4.4vw,21px);font-weight:700;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;line-height:1.3;white-space:nowrap}
.strip .d{font-size:11.5px;color:var(--ink3)}
.up{color:var(--good);font-weight:700}.down{color:var(--warn);font-weight:700}

/* ---- ブロック ---- */
section{margin-top:26px}
h2{font-size:15px;margin:0 0 3px;font-weight:700;letter-spacing:.01em}
.lede{font-size:12.5px;color:var(--ink2);margin:0 0 12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}

/* ---- 目標バー ---- */
.goal{display:flex;flex-direction:column;gap:16px}
.goal .g{display:grid;grid-template-columns:1fr auto;gap:3px 12px;align-items:baseline}
.goal .n{font-size:13.5px;font-weight:600}
.goal .val{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.goal .tgt{font-size:11.5px;color:var(--ink3);grid-column:1/-1;margin-top:-2px}
.track{grid-column:1/-1;background:var(--line2);border-radius:99px;height:8px;overflow:hidden;margin-top:5px}
.track i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.track i.ok{background:var(--good)}.track i.bad{background:var(--warn)}

/* ---- 予約経路 ---- */
.routes{display:flex;flex-direction:column;gap:10px}
.routes .r{display:grid;grid-template-columns:minmax(88px,auto) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.routes .r b{font-weight:600}
.routes .bar{background:var(--line2);border-radius:99px;height:7px;overflow:hidden}
.routes .bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.routes .num{font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap;font-size:12px}

/* ---- コメント ---- */
.notes{display:flex;flex-direction:column;gap:9px}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);
  border-radius:0 11px 11px 0;padding:11px 14px;font-size:13.5px;line-height:1.65}
.note.g{border-color:var(--good);background:var(--good-soft)}
.note.r{border-color:var(--warn);background:var(--warn-soft)}
.note.y{border-color:var(--caution);background:var(--caution-soft)}
h3{font-size:12px;margin:16px 0 7px;color:var(--ink2);font-weight:700;letter-spacing:.05em}
h3:first-child{margin-top:0}

/* ---- 表 ---- */
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);
  border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:700px}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;
  border-bottom:1px solid var(--line2)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);
  font-variant-numeric:normal;border-right:1px solid var(--line2)}
thead th{font-size:11px;color:var(--ink2);font-weight:700;letter-spacing:.03em;background:var(--surface2)}
thead th:first-child{background:var(--surface2)}
tbody tr:last-child td{border-bottom:0}
tr.total td{font-weight:700;background:var(--surface2)}
tr.total td:first-child{background:var(--surface2)}
.ok{color:var(--good);font-weight:700}.bad{color:var(--warn);font-weight:700}

/* ---- 個人 ---- */
.who{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.who h2{font-size:21px;letter-spacing:-.01em}
.tag{font-size:11.5px;padding:3px 11px;border-radius:99px;background:var(--accent-soft);
  color:var(--accent);font-weight:700}

/* ---- グラフ ---- */
svg.chart{width:100%;height:auto;max-height:190px;display:block;overflow:visible}
.mbar{cursor:pointer}
.switch{display:inline-flex;gap:2px;background:var(--line2);border-radius:9px;padding:3px;margin-bottom:12px}
.switch button{font:inherit;font-size:12.5px;font-weight:600;padding:6px 15px;border:0;border-radius:7px;
  background:none;color:var(--ink2);cursor:pointer;min-height:34px}
.switch button[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.09)}
.switch button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wd{font-size:11px;color:var(--ink3);margin-left:2px}
.wd.sat{color:var(--accent)}.wd.sun{color:var(--warn)}
svg.chart rect.mbar:hover~rect,svg.chart rect.mbar:hover{opacity:.85}
.foot{color:var(--ink3);font-size:11.5px;margin-top:32px;border-top:1px solid var(--line);
  padding-top:16px;line-height:1.7}
@media(max-width:560px){
  .strip{grid-template-columns:1fr 1fr}
  .top h1{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
<div class="top">
<p class="brand">AI TOKYO men's 池袋</p>
<h1>スタイリスト分析</h1>
<div class="ctrl"><select id="m" aria-label="対象月"></select>
<span id="ls" hidden></span><select id="s" aria-label="スタイリスト" hidden></select></div>
<div class="seg" role="tablist"><button data-v="store" role="tab" aria-selected="true">店舗全体</button><button data-v="rank" role="tab" aria-selected="false">スタイリスト比較</button><button data-v="person" role="tab" aria-selected="false">個人カルテ</button></div>
</div>
<div class="topspace"></div>
<div id="view"></div>
<p class="foot">ビューティーメリットのデータをもとに自動作成しています。数値の最終確認は管理画面でお願いします。<br>売上・スタッフ個人の実績を含みます。共有範囲にご注意ください。<br>※これは一般的な情報です。実際の判断は、専門家（弁護士・税理士など）に必ずご確認ください。</p>
</div>

<script id="appcode" type="text/plain">const P = JSON.parse(document.getElementById('payload').textContent);
const T = P.target;
const yen = n => Math.round(n).toLocaleString('ja-JP');
const pct = n => n.toFixed(1) + '%';
const esc = s => String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const complete = P.months.filter(m => !P.data[m].partial);
let view = 'store';
let month = complete.length ? complete[complete.length - 1] : P.months[P.months.length - 1];
let person = null;

const selM = document.getElementById('m'), selS = document.getElementById('s'), lblS = document.getElementById('ls');
P.months.forEach(m => selM.add(new Option(
  m.slice(0, 4) + '年' + Number(m.slice(5)) + '月' + (P.data[m].partial ? '（集計途中）' : ''), m)));
selM.value = month;

const cur = () => P.data[month];
const prev = () => { const i = P.months.indexOf(month); return i > 0 ? P.data[P.months[i - 1]] : null; };
const stylists = () => cur().stylists;

function delta(a, b, invert) {
  if (!b) return '';
  const d = (a - b) / b * 100;
  if (Math.abs(d) < 0.5) return '<span class="d">前月比 ±0%</span>';
  const good = invert ? d < 0 : d > 0;
  return `<span class="d">前月比 <span class="${good ? 'up' : 'down'}">${d > 0 ? '+' : ''}${d.toFixed(1)}%</span></span>`;
}

/* 6ヶ月の棒グラフ（選択中の月を強調し、その値だけラベルを出す） */
function chart(key, isStore, unit) {
  const vals = P.months.map(m => isStore ? P.data[m].store[key]
    : ((P.data[m].stylists.find(s => s.name === person) || {})[key] || 0));
  const max = Math.max(...vals, 1);
  const W = 100, H = 26, pad = 1.6, n = vals.length;
  const bw = (W - pad * (n - 1)) / n;
  let bars = '', labs = '';
  vals.forEach((v, i) => {
    const h = Math.max(1, v / max * (H - 7));
    const x = i * (bw + pad), y = H - h;
    const on = P.months[i] === month;
    const tag = isStore || true ? P.months[i] : '';
    bars += `<rect class="mbar" data-m="${tag}" x="${x.toFixed(2)}" y="0" width="${bw.toFixed(2)}" height="${H}"
      fill="transparent"></rect>`;
    bars += `<rect class="mbar" data-m="${tag}" x="${x.toFixed(2)}" y="${y.toFixed(2)}" width="${bw.toFixed(2)}" height="${h.toFixed(2)}"
      rx=".8" fill="var(--${on ? 'accent' : 'line'})"><title>${tag.slice(0,4)}年${Number(tag.slice(5))}月　${yen(v)}円</title></rect>`;
    if (on) bars += `<text x="${(x + bw / 2).toFixed(2)}" y="${(y - 1.8).toFixed(2)}"
      text-anchor="middle" font-size="3.6" font-weight="700" fill="var(--accent)">${yen(v)}${unit || ''}</text>`;
    labs += `<text class="mbar" data-m="${tag}" x="${(x + bw / 2).toFixed(2)}" y="${H + 4.4}" text-anchor="middle"
      font-size="3.2" fill="var(--${on ? 'ink2' : 'ink3'})" font-weight="${on ? 700 : 400}">${Number(P.months[i].slice(5))}月</text>`;
  });
  return `<svg class="chart" viewBox="-2 -6.5 ${W + 4} ${H + 12}" role="img"
    aria-label="月ごとの推移"><line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="var(--line)"
    stroke-width=".3"></line>${bars}${labs}</svg>`;
}

/* 日別：グラフと一覧を切り替えられる形で返す */
function dailyBlock(rows, id) {
  if (!rows || !rows.length) return '<p class="mini">この月のデータがありません。</p>';
  return `<div class="switch">
      <button type="button" class="dtab" data-t="${id}" data-v="chart" aria-selected="true">グラフ</button>
      <button type="button" class="dtab" data-t="${id}" data-v="list" aria-selected="false">一覧</button>
    </div>
    <div id="${id}-chart">${daily(rows)}</div>
    <div id="${id}-list" hidden>${dailyTable(rows)}</div>`;
}

const WD = ['日', '月', '火', '水', '木', '金', '土'];

function dailyTable(rows) {
  const y = Number(month.slice(0, 4)), mo = Number(month.slice(5));
  const sum = rows.reduce((a, r) => [a[0] + r[1], a[1] + r[2], a[2] + r[3]], [0, 0, 0]);
  let h = `<div class="tbl"><table><thead><tr>
    <th>日付</th><th>売上</th><th>客数</th><th>客単価</th><th>店販</th></tr></thead><tbody>`;
  rows.forEach(([d, v, c, g]) => {
    const w = new Date(y, mo - 1, d).getDay();
    const off = v === 0;
    h += `<tr${off ? ' style="opacity:.5"' : ''}>
      <td>${mo}/${d}<span class="wd ${w === 0 ? 'sun' : w === 6 ? 'sat' : ''}">（${WD[w]}）</span></td>
      <td>${off ? '—' : yen(v) + '円'}</td>
      <td>${off ? '—' : c + '人'}</td>
      <td>${c ? yen(v / c) + '円' : '—'}</td>
      <td>${g ? yen(g) + '円' : '—'}</td></tr>`;
  });
  h += `<tr class="total"><td>合計</td><td>${yen(sum[0])}円</td><td>${sum[1]}人</td>
    <td>${sum[1] ? yen(sum[0] / sum[1]) + '円' : '—'}</td><td>${yen(sum[2])}円</td></tr>`;
  return h + `</tbody></table></div>`;
}

/* 日別の売上（棒グラフ） */
function daily(rows) {
  if (!rows || !rows.length) return '<p class="mini">この月のデータがありません。</p>';
  const max = Math.max(...rows.map(r => r[1]), 1);
  const W = 100, H = 26, n = rows.length, gap = 0.5;
  const bw = (W - gap * (n - 1)) / n;
  const best = rows.reduce((a, b) => b[1] > a[1] ? b : a, rows[0]);
  let bars = '', labs = '';
  rows.forEach((r, i) => {
    const [d, v, c] = r;
    const h = Math.max(v > 0 ? 0.8 : 0.3, v / max * (H - 5));
    const x = i * (bw + gap);
    const top = v === best[1] && v > 0;
    bars += `<rect x="${x.toFixed(2)}" y="${(H - h).toFixed(2)}" width="${bw.toFixed(2)}"
      height="${h.toFixed(2)}" rx=".5" fill="var(--${v === 0 ? 'line2' : top ? 'accent' : 'line'})"
      ><title>${d}日　${yen(v)}円　${c}人</title></rect>`;
    if (d === 1 || d % 5 === 0 || i === n - 1) {
      labs += `<text x="${(x + bw / 2).toFixed(2)}" y="${H + 4}" text-anchor="middle"
        font-size="2.9" fill="var(--ink3)">${d}</text>`;
    }
  });
  const sum = rows.reduce((a, b) => a + b[1], 0);
  const open = rows.filter(r => r[1] > 0).length;
  return `<svg class="chart" viewBox="-1 -2 ${W + 2} ${H + 8}" role="img"
    aria-label="日ごとの売上"><line x1="0" y1="${H}" x2="${W}" y2="${H}" stroke="var(--line)"
    stroke-width=".25"></line>${bars}${labs}</svg>
    <p class="mini" style="margin-top:8px">営業 ${open}日／1日平均 ${yen(sum / Math.max(open, 1))}円　
    いちばん多かったのは ${best[0]}日の ${yen(best[1])}円（${best[2]}人）</p>`;
}

/* 売上の内訳：細かい分解 */
function detailTable(rows, unit) {
  if (!rows || !rows.length) return '<p class="mini">この月はありません。</p>';
  const tot = rows.reduce((a, r) => a + Math.abs(r[2]), 0) || 1;
  return `<div class="tbl"><table><thead><tr>
    <th>${unit || '項目'}</th><th>件数</th><th>金額</th><th>割合</th></tr></thead><tbody>` +
    rows.map(([k, c, v]) => `<tr><td>${esc(k)}</td><td>${c}</td>
      <td style="${v < 0 ? 'color:var(--warn)' : ''}">${v < 0 ? '−' : ''}${yen(Math.abs(v))}円</td>
      <td>${(Math.abs(v) / tot * 100).toFixed(1)}%</td></tr>`).join('') +
    `</tbody></table></div>`;
}

function breakdownDetail(x, id) {
  const d = x.detail || {};
  const blocks = [
    ['tech', '技術の内訳（メニューの種類ごと）', 'メニューの種類'],
    ['tech_items', '技術の内訳（メニュー名ごと）', 'メニュー名'],
    ['goods', '店販の内訳', '商品'],
    ['nominate', '指名料', '区分'],
    ['discount', '割引の内訳', 'クーポン'],
    ['points', '利用ポイント', '予約経路'],
  ].filter(b => (d[b[0]] || []).length);
  return blocks.map(([k, title, unit], i) =>
    `<h3 style="margin-top:${i ? 20 : 4}px">${title}</h3>${detailTable(d[k], unit)}`).join('');
}

/* 売上の内訳 */
function breakdown(x) {
  const rows = [
    ['技術（メニュー・クーポン）', x.tech, 'accent'],
    ['店販', x.goods, 'green'],
    ['指名料', x.nominate_fee, 'purple'],
    ['割引', x.discount, 'warn'],
    ['利用ポイント', -x.points, 'warn'],
  ].filter(r => r[1]);
  const plus = rows.filter(r => r[1] > 0).reduce((a, b) => a + b[1], 0) || 1;
  const head = `<div class="r" style="padding-bottom:9px;margin-bottom:2px;border-bottom:1px solid var(--line)">
      <b>総売上（割引前）</b><div></div>
      <span class="num" style="font-weight:700;color:var(--ink)">${yen(x.gross)}円</span></div>`;
  return `<div class="panel routes">` + head + rows.map(([k, v, c]) =>
    `<div class="r"><b>${k}</b>
      <div class="bar"><i style="width:${Math.min(100, Math.abs(v) / plus * 100).toFixed(1)}%;
        background:var(--${c})"></i></div>
      <span class="num" style="color:var(--${v < 0 ? 'warn' : 'ink2'})">${v > 0 ? '' : '−'}${yen(Math.abs(v))}円</span></div>`).join('') +
    `<div class="r" style="border-top:1px solid var(--line);padding-top:9px;margin-top:2px">
      <b>純売上</b><div></div><span class="num" style="font-weight:700;color:var(--ink)">${yen(x.net)}円</span></div>
    </div>`;
}

function goal(label, value, target, fmt, invert) {
  const hit = invert ? value <= target : value >= target;
  const w = invert ? Math.min(100, target / Math.max(value, .01) * 100)
                   : Math.min(100, value / target * 100);
  return `<div class="g"><span class="n">${label}</span><span class="val">${fmt(value)}</span>
    <span class="tgt">目標 ${fmt(target)}${invert ? ' 以下' : ''}　${hit ? '達成' : '未達'}</span>
    <div class="track"><i class="${hit ? 'ok' : (w >= 50 ? '' : 'bad')}" style="width:${w.toFixed(1)}%"></i></div></div>`;
}

const notes = (a, c) => a.length ? `<div class="notes">${a.map(t => `<div class="note ${c}">${esc(t)}</div>`).join('')}</div>` : '';

function partial() {
  const d = cur();
  if (!d.partial) return '';
  return `<section><div class="note r"><b>この月はまだ集計の途中です。</b>
    ${Number(month.slice(5))}月1日〜${Number(d.end.slice(8))}日までの数字なので、前月比は参考としてご覧ください。</div></section>`;
}

  </div>`;

  const r = s.return;
  h += `<section><h2>目標に対して、いま どこにいるか</h2>

    </div></section>`;

  h += `<section><h2>店販</h2>
    <p class="lede">お会計 ${yen(s.customers)}件のうち、${s.goods_buyers}件で店販が売れました。</p>
    <div class="strip" style="margin-top:0">
      <div><div class="k">店販売上</div><div class="v">${yen(s.goods)}</div><div class="d">${delta(s.goods, pv?.goods) || '円'}</div></div>
      <div><div class="k">買ったお客様</div><div class="v">${s.goods_buyers}<span style="font-size:.62em">人</span></div><div class="d">お客様の ${pct(s.goods_buy_rate)}</div></div>
      <div><div class="k">買った方の平均</div><div class="v">${yen(s.goods_per_buyer)}</div><div class="d">円（${s.goods_items}点・1点 ${yen(s.goods_per_item)}円）</div></div>

  if (d.top_goods?.length) {

  h += `<section><h2>日ごとの売上</h2>

  h += `<section><h2>売上の内訳</h2>
    <p class="lede">足し引きすると純売上になります。「細かく」を押すと、中身まで見られます。</p>
    <div class="switch">
      <button type="button" class="dtab" data-t="bs" data-v="chart" aria-selected="true">ざっくり</button>
      <button type="button" class="dtab" data-t="bs" data-v="list" aria-selected="false">細かく</button>

    </section>`;

  const rs = Object.entries(s.routes || {}).sort((a, b) => b[1] - a[1]);
  const tot = rs.reduce((a, b) => a + b[1], 0) || 1;
  h += `<section><h2>ご予約はどこから入っているか</h2>

      <span class="num">${v}件 ${(v / tot * 100).toFixed(1)}%</span></div>`).join('') + `</div></section>`;

  const f = d.store_feedback;
  h += `<section><h2>この月のフィードバック</h2><p class="lede">目標との差から自動で書き出しています。</p><div class="panel">`;

  if (f.issues.length) h += `<h3>伸びしろ</h3>` + notes(f.issues, 'r');
  if (f.actions.length) h += `<h3>次の一手</h3>` + notes(f.actions, 'y');

      `</tbody></table></div></section>`;

function renderRank() {
  const d = cur(), s = d.store;
  const cols = [
    ['総売上', x => yen(x.gross) + '円'],
    ['純売上', x => yen(x.net) + '円'],
    ['客数', x => x.customers],
    ['客単価', x => yen(x.avg) + '円', x => x.avg >= s.avg ? 1 : 0],
    ['新規率', x => pct(x.new_rate)],
    ['指名率', x => pct(x.nom_rate)],
    ['フリー予約', x => `${x.free_count}件 ${pct(x.free_rate)}`],
    ['次回予約', x => `${x.rebook}件 ${pct(x.rebook_rate)}`, x => x.rebook_rate >= T.rebook_rate ? 1 : (x.rebook_rate <= .5 ? -1 : 0)],
    ['トリートメント', x => pct(x.treat_rate), x => x.treat_rate >= T.treat_rate ? 1 : (x.treat_rate <= 1 ? -1 : 0)],
    ['リターン率', x => x.return ? pct(x.return.rate) : '—',
      x => !x.return ? 0 : (x.return.rate >= T.return_rate ? 1 : (x.return.rate <= (s.return?.rate ?? 0) * .6 ? -1 : 0))],
    ['店販売上', x => yen(x.goods) + '円'],
    ['店販を買った率', x => pct(x.goods_buy_rate), x => x.goods_buy_rate >= s.goods_buy_rate * 1.25 ? 1 : (x.goods_buy_rate <= s.goods_buy_rate * .6 ? -1 : 0)],
    ['買った方の平均', x => x.goods_buyers ? yen(x.goods_per_buyer) + '円' : '—'],
    ['店販/客（全員平均）', x => yen(x.goods_per) + '円', x => x.goods_per >= T.goods_per ? 1 : (x.goods_per < s.goods_per * .6 ? -1 : 0)],
  ];
  let h = partial();
  h += `<section><h2>スタイリスト比較</h2>
    <p class="lede">緑は目標達成または店舗平均より良いところ、赤は伸びしろがあるところです。横にスクロールできます。<br>
    「店舗全体」の行には、フリー枠など一覧に出ていないスタッフの分も含まれます。</p>
    <div class="tbl"><table><thead><tr><th>スタイリスト</th>${cols.map(c => `<th>${c[0]}</th>`).join('')}</tr></thead><tbody>`;
  d.stylists.forEach(x => {
    h += `<tr><td>${esc(x.name)}</td>` + cols.map(c => {
      const j = c[2] ? c[2](x) : 0;
      return `<td class="${j > 0 ? 'ok' : j < 0 ? 'bad' : ''}">${c[1](x)}</td>`;
    }).join('') + `</tr>`;
  });
  h += `<tr class="total"><td>店舗全体</td><td>${yen(s.gross)}円</td><td>${yen(s.net)}円</td><td>${s.customers}</td>
    <td>${yen(s.avg)}円</td><td>${pct(s.new_rate)}</td><td>${pct(s.nom_rate)}</td>
    <td>${s.free_count}件 ${pct(s.free_rate)}</td>
    <td>${s.rebook}件 ${pct(s.rebook_rate)}</td><td>${pct(s.treat_rate)}</td>
    <td>${s.return ? pct(s.return.rate) : '—'}</td><td>${yen(s.goods)}円</td>
    <td>${pct(s.goods_buy_rate)}</td><td>${yen(s.goods_per_buyer)}円</td>
    <td>${yen(s.goods_per)}円</td></tr></tbody></table></div></section>`;

  h += `<section><h2>次回予約率</h2><p class="lede">目標は10%です。</p><div class="panel routes">` +
    [...d.stylists].sort((a, b) => b.rebook_rate - a.rebook_rate).map(x =>
      `<div class="r"><b>${esc(x.name)}</b>
       <div class="bar"><i style="width:${Math.min(100, x.rebook_rate / T.rebook_rate * 100).toFixed(1)}%;
         background:var(--${x.rebook_rate >= T.rebook_rate ? 'good' : x.rebook_rate >= 3 ? 'accent' : 'warn'})"></i></div>
       <span class="num">${x.rebook}件 ${pct(x.rebook_rate)}</span></div>`).join('') + `</div></section>`;
  return h;
}

function renderPerson() {

  h += `<section><h2>日ごとの売上</h2>

    <div class="panel">${dailyBlock(x.daily, 'dp')}</div></section>`;

  h += `<section><h2>売上の内訳</h2>

    </div>
    <div id="bp-chart">${breakdown(x)}</div>
    <div id="bp-list" hidden><div class="panel">${breakdownDetail(x, 'bp')}</div></div>
    </section>`;

  h += `<section><h2>目標に対して</h2><p class="lede">かっこ内は店舗全体の数字です。</p><div class="panel goal">

        x.return.rate, T.return_rate, pct)
      : `<div class="g"><span class="n">リターン率</span><span class="val">—</span>
         <span class="tgt">まだ判定できる日数が経っていません</span></div>`}
    ${goal(`トリートメント装着率（店舗 ${pct(s.treat_rate)}）`, x.treat_rate, T.treat_rate, pct)}
    ${goal(`店販（1人あたり・全員平均／店舗 ${yen(s.goods_per)}円）`, x.goods_per, T.goods_per, v => yen(v) + '円')}
    </div></section>`;
  h += `<section><h2>フィードバック</h2><div class="panel">`;

  if (f.strengths.length) h += `<h3>強み</h3>` + notes(f.strengths, 'g');
  if (f.issues.length) h += `<h3>伸びしろ</h3>` + notes(f.issues, 'r');
  if (f.actions.length) h += `<h3>次の一手</h3>` + notes(f.actions, 'y');
  h += `</div></section>`;
  return h;
}

function render() {
  selS.innerHTML = '';
  stylists().forEach(v => selS.add(new Option(v.name, v.name)));
  if (!person || !stylists().some(v => v.name === person)) person = stylists()[0]?.name;
  if (person) selS.value = person;
  const show = view === 'person';
  selS.hidden = !show; lblS.hidden = !show;
  document.getElementById('view').innerHTML =
    view === 'store' ? renderStore() : view === 'rank' ? renderRank() : renderPerson();
  window.scrollTo({top: 0, behavior: 'instant'});
}

document.getElementById('view').addEventListener('click', ev => {
  const tab = ev.target.closest('.dtab');
  if (tab) {
    const id = tab.dataset.t, v = tab.dataset.v;
    document.querySelectorAll(`.dtab[data-t="${id}"]`).forEach(b =>
      b.setAttribute('aria-selected', String(b === tab)));
    document.getElementById(id + '-chart').hidden = v !== 'chart';
    document.getElementById(id + '-list').hidden = v !== 'list';
    return;
  }
  const t = ev.target.closest('.mbar');
  if (!t) return;
  const m = t.getAttribute('data-m');
  if (m && P.data[m] && m !== month) { month = m; selM.value = m; render(); }
});

document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  document.querySelectorAll('.seg button').forEach(t => t.setAttribute('aria-selected', String(t === b)));
  view = b.dataset.v; render();
}));
selM.addEventListener('change', e => { month = e.target.value; render(); });
selS.addEventListener('change', e => { person = e.target.value; render(); });
render();</script>

  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const KEY = "ikebukuro-kpi-pass";
  const lock = document.getElementById('lock');
  const err = document.getElementById('err');
  const btn = document.getElementById('go');

  async function decrypt(pw) {
    const enc = JSON.parse(S);
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),
      'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name: 'PBKDF2', salt: b64(enc.s), iterations: enc.n, hash: 'SHA-256'},
      base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(enc.i)}, key, b64(enc.c));
    return new TextDecoder().decode(plain);
  }

  function start(json) {
    const p = document.createElement('script');
    p.id = 'payload'; p.type = 'application/json'; p.textContent = json;
    document.body.appendChild(p);
    const code = document.getElementById('appcode').textContent;
    (0, eval)(code);
    document.body.classList.remove('locked');
    lock.remove();
  }

  async function tryOpen(pw, fromSaved) {
    try {
      const json = await decrypt(pw);
      try { localStorage.setItem(KEY, pw); } catch (e) {}
      start(json);
      return true;
    } catch (e) {
      if (!fromSaved) { err.textContent = '合言葉が違うようです。'; }
      try { if (fromSaved) localStorage.removeItem(KEY); } catch (e2) {}
      return false;
    }
  }

  document.getElementById('lockform').addEventListener('submit', async ev => {
    ev.preventDefault();
    err.textContent = ''; btn.disabled = true; btn.textContent = '確認中…';
    await tryOpen(document.getElementById('pw').value, false);
    btn.disabled = false; btn.textContent = '開く';
  });

  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) { tryOpen(saved, true); }
})();
