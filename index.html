<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#131418" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ニュース">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}img{max-width:100%}[hidden]{display:none!important}
</style>
</head>
<body>
<script>document.body.className="locked"</script><title>ニュースダイジェスト</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root{
  color-scheme:light;
  --paper:#f7f6f2; --surface:#ffffff; --surface2:#faf9f5;
  --ink:#191a1d; --ink2:#5c5a52; --ink3:#8b8981;
  --line:#e4e1d8; --line2:#efece4;
  --accent:#2d4a7c; --accent-soft:#e7edf7;
  --blue:#2d6fd1;   --blue-soft:#e8f0fd;
  --orange:#d9662b; --orange-soft:#fdeee4;
  --green:#12855c;  --green-soft:#e2f4ec;
  --purple:#6b4fd6; --purple-soft:#ece8fd;
  --red:#c9403c;    --red-soft:#fdeae9;
  --yellow:#b07d00; --yellow-soft:#fbf1d9;
  --teal:#0f8b8d;   --teal-soft:#e2f3f3;
  --pink:#c2468b;   --pink-soft:#fce9f3;
  --good:#12855c;   --good-soft:#e2f4ec;
  --warn:#c9403c;   --warn-soft:#fdeae9;
  --caution:#b07d00; --caution-soft:#fbf1d9;
  --sans:"IBM Plex Sans","Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --paper:#131418; --surface:#1b1d22; --surface2:#21242b;
  --ink:#f1f0ea; --ink2:#a5a39a; --ink3:#7a7871;
  --line:#2d3038; --line2:#24272e;
  --accent:#8fb0e8; --accent-soft:#1c2637;
  --blue:#7fa9f0;   --blue-soft:#182335;
  --orange:#f09a62; --orange-soft:#33210f;
  --green:#4fc596;  --green-soft:#12291f;
  --purple:#a892f5; --purple-soft:#241d3d;
  --red:#f0837e;    --red-soft:#331b19;
  --yellow:#dfb149; --yellow-soft:#2c2411;
  --teal:#4fbcbe;   --teal-soft:#122a2b;
  --pink:#e88ac0;   --pink-soft:#301a27;
  --good:#4fc596;   --good-soft:#12291f;
  --warn:#f0837e;   --warn-soft:#331b19;
  --caution:#dfb149; --caution-soft:#2c2411;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#131418; --surface:#1b1d22; --surface2:#21242b;
  --ink:#f1f0ea; --ink2:#a5a39a; --ink3:#7a7871;
  --line:#2d3038; --line2:#24272e;
  --accent:#8fb0e8; --accent-soft:#1c2637;
  --blue:#7fa9f0;   --blue-soft:#182335;
  --orange:#f09a62; --orange-soft:#33210f;
  --green:#4fc596;  --green-soft:#12291f;
  --purple:#a892f5; --purple-soft:#241d3d;
  --red:#f0837e;    --red-soft:#331b19;
  --yellow:#dfb149; --yellow-soft:#2c2411;
  --teal:#4fbcbe;   --teal-soft:#122a2b;
  --pink:#e88ac0;   --pink-soft:#301a27;
  --good:#4fc596;   --good-soft:#12291f;
  --warn:#f0837e;   --warn-soft:#331b19;
  --caution:#dfb149; --caution-soft:#2c2411;
}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);margin:0;
  font-size:15px;line-height:1.7;-webkit-text-size-adjust:100%;
  font-feature-settings:"palt" 1}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 72px}

/* ---- 上部固定バー ---- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--paper);
  border-bottom:1px solid var(--line);margin-inline:-16px;padding:11px 16px 0}
.sectab{display:flex;gap:4px;overflow-x:auto;-webkit-overflow-scrolling:touch;
  scrollbar-width:none;margin:10px -16px 0;padding:0 16px 8px;scroll-behavior:smooth;
  cursor:grab;user-select:none;
  -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 22px),transparent 100%);
  mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 22px),transparent 100%)}
.sectab.grabbing{cursor:grabbing;scroll-behavior:auto}
.sectab::-webkit-scrollbar{display:none}
.sectab-b{font:inherit;font-size:12.5px;font-weight:600;white-space:nowrap;flex:none;
  padding:7px 13px;border:1px solid var(--line);border-radius:99px;background:var(--surface);
  color:var(--ink2);cursor:pointer;min-height:34px}
.sectab-b[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.sectab-b:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.topbar{display:flex;align-items:center;gap:12px}
#menubtn{flex:none;width:42px;height:42px;border:1px solid var(--line);border-radius:11px;
  background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
#menubtn .bars{display:flex;flex-direction:column;gap:4px;width:17px}
#menubtn i{display:block;height:2px;border-radius:2px;background:var(--ink);transition:transform .18s,opacity .18s}
#menubtn[aria-expanded="true"] i:nth-child(1){transform:translateY(6px) rotate(45deg)}
#menubtn[aria-expanded="true"] i:nth-child(2){opacity:0}
#menubtn[aria-expanded="true"] i:nth-child(3){transform:translateY(-6px) rotate(-45deg)}
#menubtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.titles{min-width:0}
.brand{font-size:10.5px;letter-spacing:.09em;color:var(--ink3);margin:0 0 1px}
.top h1{font-size:18px;margin:0;letter-spacing:-.01em;font-weight:700;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* 右上の更新ボタン */
#reloadbtn{flex:none;margin-left:auto;width:38px;height:38px;border:1px solid var(--line);
  border-radius:11px;background:var(--surface);color:var(--ink2);cursor:pointer;
  display:flex;align-items:center;justify-content:center;padding:0;
  transition:color .15s,border-color .15s}
#reloadbtn svg{width:18px;height:18px}
#reloadbtn:hover{color:var(--accent);border-color:var(--accent)}
#reloadbtn:active{transform:scale(.94)}
#reloadbtn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#reloadbtn.spin{color:var(--accent);pointer-events:none}
#reloadbtn.spin svg{animation:ptrspin .7s linear infinite}

/* ---- メニュー（左から出る引き出し） ---- */
.wrap{transition:transform .26s cubic-bezier(.4,0,.2,1);transform-origin:left center}
body.drawer{overflow:hidden}
body.drawer .wrap{transform:translateX(252px) scale(.86);border-radius:20px;
  box-shadow:0 0 40px rgba(0,0,0,.28);overflow:hidden}
#menu{position:fixed;left:0;top:0;bottom:0;width:252px;z-index:40;background:var(--surface);
  border-right:1px solid var(--line);overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateX(-103%);transition:transform .26s cubic-bezier(.4,0,.2,1);
  padding:calc(env(safe-area-inset-top,0px) + 22px) 10px calc(env(safe-area-inset-bottom,0px) + 20px)}
body.drawer #menu{transform:none}
#menu .mhead{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--ink);
  padding:0 14px 12px;margin:0;border-bottom:1px solid var(--line2);margin-bottom:8px}
#menu .mitem{display:flex;flex-direction:column;gap:2px;width:100%;text-align:left;
  font:inherit;padding:12px 14px;border:0;border-radius:11px;background:none;color:var(--ink);cursor:pointer}
#menu .mitem:hover{background:var(--surface2)}
#menu .mitem[aria-current="true"]{background:var(--accent-soft)}
#menu .mitem[aria-current="true"] b{color:var(--accent)}
#menu .mitem b{font-size:15px;font-weight:700}
#menu .mitem span{font-size:11.5px;color:var(--ink2)}
#menu .mitem:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
#menubg{position:fixed;inset:0;z-index:35;background:rgba(0,0,0,.28)}
.ctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
select{font:inherit;font-size:14px;font-weight:500;padding:8px 30px 8px 12px;border-radius:10px;
  border:1px solid var(--line);background:var(--surface);color:var(--ink);min-height:40px;
  appearance:none;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),
  linear-gradient(135deg,currentColor 50%,transparent 50%);
  background-position:calc(100% - 16px) 18px,calc(100% - 11px) 18px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.topspace{height:12px}

/* ---- 主要数字 ---- */
.hero{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin-top:16px}
.hero .lab{font-size:12px;color:var(--ink2);font-weight:600;letter-spacing:.03em}
.hero .big{font-size:clamp(30px,8vw,42px);font-weight:700;letter-spacing:-.025em;line-height:1.15;
  font-variant-numeric:tabular-nums;margin-top:2px}
.hero .sub{font-size:13px;color:var(--ink2);margin-top:3px}
.goalline{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:12px;
  padding:9px 13px;border-radius:10px;font-size:12.5px;background:var(--surface2);color:var(--ink2)}
.goalline .amt{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.goalline b{font-size:17px;font-variant-numeric:tabular-nums}
.goalline.miss{background:var(--red-soft);color:var(--red)}
.goalline.miss b{color:var(--red)}
.goalline.hit{background:var(--green-soft);color:var(--green)}
.goalline.hit b{color:var(--blue)}
.strip{display:grid;grid-template-columns:repeat(auto-fit,minmax(152px,1fr));gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-top:12px}
.strip div{background:var(--surface);padding:13px 12px}
.strip .k{font-size:11.5px;color:var(--ink2);font-weight:600}
.strip .v{font-size:clamp(17px,4.4vw,21px);font-weight:700;font-variant-numeric:tabular-nums;
  letter-spacing:-.02em;line-height:1.3;white-space:nowrap}
.strip .d{font-size:11.5px;color:var(--ink3)}
.up{color:var(--good);font-weight:700}.down{color:var(--warn);font-weight:700}

/* ---- ブロック ---- */
section{margin-top:26px}
h2{font-size:15px;margin:0 0 3px;font-weight:700;letter-spacing:.01em;
  padding-left:11px;border-left:4px solid var(--accent);line-height:1.35}
h2.c-blue{border-color:var(--blue)}h2.c-green{border-color:var(--green)}
h2.c-orange{border-color:var(--orange)}h2.c-purple{border-color:var(--purple)}
h2.c-teal{border-color:var(--teal)}h2.c-yellow{border-color:var(--yellow)}
h2.c-ink{border-color:var(--ink3)}
.lede{padding-left:15px}
.switch.wrap{display:flex;flex-wrap:wrap}
.row2{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.rowlab{font-size:11px;font-weight:700;color:var(--ink3);letter-spacing:.05em;
  min-width:62px;flex:none}
.row2 .switch{margin-bottom:0}
@media(max-width:480px){.rowlab{min-width:0}}
.dot{width:8px;height:8px;border-radius:99px;display:inline-block;margin-right:6px;vertical-align:1px}
.lede{font-size:12.5px;color:var(--ink2);margin:0 0 12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}

/* ---- 目標バー ---- */
.goal{display:flex;flex-direction:column;gap:16px}
.goal .g{display:grid;grid-template-columns:1fr auto;gap:3px 12px;align-items:baseline}
.goal .n{font-size:13.5px;font-weight:600}
.goal .val{font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.goal .tgt{font-size:11.5px;color:var(--ink3);grid-column:1/-1;margin-top:-2px}
.track{grid-column:1/-1;background:var(--line2);border-radius:99px;height:8px;overflow:hidden;margin-top:5px}
.track i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.track i.ok{background:var(--good)}.track i.bad{background:var(--warn)}

/* ---- 予約経路 ---- */
.routes{display:flex;flex-direction:column;gap:10px}
.routes .r{display:grid;grid-template-columns:minmax(88px,auto) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.routes .r b{font-weight:600}
.routes .bar{background:var(--line2);border-radius:99px;height:7px;overflow:hidden}
.routes .bar i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.routes .num{font-variant-numeric:tabular-nums;color:var(--ink2);white-space:nowrap;font-size:12px}

/* ---- コメント ---- */
.notes{display:flex;flex-direction:column;gap:9px}
.note{border-left:3px solid var(--accent);background:var(--accent-soft);
  border-radius:0 11px 11px 0;padding:11px 14px;font-size:13.5px;line-height:1.65}
.note.g{border-color:var(--good);background:var(--good-soft)}
.note.r{border-color:var(--warn);background:var(--warn-soft)}
.note.y{border-color:var(--caution);background:var(--caution-soft)}
h3{font-size:12px;margin:16px 0 7px;color:var(--ink2);font-weight:700;letter-spacing:.05em}
h3:first-child{margin-top:0}

/* ---- 表 ---- */
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch;border:1px solid var(--line);
  border-radius:14px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px;min-width:700px}
th,td{padding:10px 12px;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;
  border-bottom:1px solid var(--line2)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);
  font-variant-numeric:normal;border-right:1px solid var(--line2)}
thead th{font-size:11px;color:var(--ink2);font-weight:700;letter-spacing:.03em;background:var(--surface2)}
thead th:first-child{background:var(--surface2)}
tbody tr:last-child td{border-bottom:0}
tr.total td{font-weight:700;background:var(--surface2)}
tr.total td:first-child{background:var(--surface2)}
.ok{color:var(--good);font-weight:700}.bad{color:var(--warn);font-weight:700}

/* ---- 個人 ---- */
.who{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:2px}
.who h2{font-size:21px;letter-spacing:-.01em}
.tag{font-size:11.5px;padding:3px 11px;border-radius:99px;background:var(--accent-soft);
  color:var(--accent);font-weight:700}

/* ---- グラフ ---- */
svg.chart{width:100%;height:auto;max-height:190px;display:block;overflow:visible}
.mbar,.dbar,.gbar,.tbar{cursor:pointer}
svg.trend{max-height:240px}
.legend{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:6px 14px;margin-top:9px}
.legend div{display:flex;align-items:center;gap:7px;font-size:12.5px}
.legend i{width:12px;height:3px;border-radius:2px;flex:none}
.legend span{color:var(--ink2);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legend b{font-variant-numeric:tabular-nums;white-space:nowrap}
.ckey{display:flex;flex-wrap:wrap;gap:7px 15px;margin:11px 0 3px;font-size:12px}
.ckey span{display:inline-flex;align-items:center;gap:6px;color:var(--ink2)}
.ckey i{width:15px;height:4px;border-radius:2px;flex:none}
.dayinfo{margin-top:14px;padding:13px 15px;border-radius:12px;background:var(--accent-soft);
  border-left:3px solid var(--accent)}
.dhead{font-size:15px;font-weight:700;letter-spacing:-.01em}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(94px,1fr));gap:10px 14px;margin-top:9px}
.dgrid div{display:flex;flex-direction:column;gap:1px}
.dgrid span{font-size:11px;color:var(--ink2);font-weight:600}
.dgrid b{font-size:16px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;white-space:nowrap}
.switch{display:inline-flex;gap:2px;background:var(--line2);border-radius:9px;padding:3px;margin-bottom:12px}
.switch button,.gtab{font:inherit;font-size:12.5px;font-weight:600;padding:6px 15px;border:0;border-radius:7px;
  background:none;color:var(--ink2);cursor:pointer;min-height:34px}
.switch button[aria-selected="true"],.gtab[aria-selected="true"]{background:var(--surface);color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.09)}
.switch button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.wd{font-size:11px;color:var(--ink3);margin-left:2px}
.wd.sat{color:var(--accent)}.wd.sun{color:var(--warn)}
svg.chart rect.mbar:hover~rect,svg.chart rect.mbar:hover{opacity:.85}
.foot{color:var(--ink3);font-size:11.5px;margin-top:32px;border-top:1px solid var(--line);
  padding-top:16px;line-height:1.7}
@media(max-width:560px){
  .strip{grid-template-columns:1fr 1fr}
  .top h1{font-size:17px}
}
/* ── AIに聞く ── */
.chat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;
  display:flex;flex-direction:column;gap:12px}
.clog{display:flex;flex-direction:column;gap:12px;max-height:56vh;min-height:150px;
  overflow-y:auto;overscroll-behavior:contain;padding:2px}
.cempty{color:var(--ink3);font-size:12.5px;text-align:center;padding:38px 12px;line-height:1.8}
.cmsg{display:flex;flex-direction:column;gap:3px;max-width:88%}
.cmsg.me{align-self:flex-end;align-items:flex-end}
.cmsg.ai{align-self:flex-start}
.cwho{font-size:10.5px;font-weight:700;color:var(--purple);letter-spacing:.08em;padding-left:3px}
.cbub{font-size:13.5px;line-height:1.85;padding:11px 14px;border-radius:15px;
  background:var(--surface2);border:1px solid var(--line2);color:var(--ink);
  white-space:normal;overflow-wrap:anywhere}
.cmsg.me .cbub{background:var(--accent-soft);border-color:transparent;border-bottom-right-radius:5px}
.cmsg.ai .cbub{border-bottom-left-radius:5px}
.cbub b{font-weight:700}
.cbub.err{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.cbub.thinking{display:flex;gap:5px;align-items:center;padding:15px 16px}
.cbub.thinking i{width:6px;height:6px;border-radius:50%;background:var(--ink3);
  animation:cdot 1.1s infinite ease-in-out}
.cbub.thinking i:nth-child(2){animation-delay:.18s}
.cbub.thinking i:nth-child(3){animation-delay:.36s}
@keyframes cdot{0%,60%,100%{opacity:.28;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
.csamples{display:flex;gap:7px;flex-wrap:wrap;border-top:1px solid var(--line2);padding-top:12px}
.csample{font:inherit;font-size:12px;padding:7px 13px;border:1px solid var(--line);
  border-radius:999px;background:var(--surface2);color:var(--ink2);cursor:pointer;min-height:34px}
.csample:hover:not(:disabled){border-color:var(--purple);color:var(--purple);background:var(--purple-soft)}
.csample:disabled{opacity:.45;cursor:default}
.cform{display:flex;gap:9px;align-items:flex-end}
#chatq{flex:1;font:inherit;font-size:16px;line-height:1.6;padding:11px 14px;resize:none;
  border:1px solid var(--line);border-radius:14px;background:var(--surface2);color:var(--ink);
  min-height:44px;max-height:150px;overflow-y:auto}
#chatq:focus{outline:0;border-color:var(--purple);background:var(--surface)}
#chatq:disabled{opacity:.6}
#csend{font:inherit;font-size:13px;font-weight:700;padding:0 19px;height:44px;flex:none;
  border:0;border-radius:14px;background:var(--purple);color:#fff;cursor:pointer}
#csend:disabled{background:var(--line);color:var(--ink3);cursor:default}
.cfoot{display:flex;justify-content:flex-end}
#cclear{font:inherit;font-size:11.5px;padding:6px 12px;border:1px solid var(--line2);
  border-radius:8px;background:none;color:var(--ink3);cursor:pointer;min-height:32px}
#cclear:hover{color:var(--ink2);border-color:var(--line)}
@media(max-width:560px){.cmsg{max-width:94%}.clog{max-height:50vh}}
/* 詳しく見る・更新時刻 */
table td.z{color:var(--ink3)}
.foot #built{display:block;color:var(--ink2);font-weight:600;margin-bottom:5px}
.foot #built.stale{color:var(--warn);font-weight:700}
.switch.wrap button{flex:none}
/* 下に引っ張って更新 */
#ptr{position:fixed;left:0;right:0;top:0;z-index:60;height:52px;margin-top:-52px;
  display:flex;align-items:center;justify-content:center;gap:9px;pointer-events:none;

  const NEWS = JSON.parse(document.getElementById('nd').textContent);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const KEY = "ikebukuro-kpi-pass";
  const site = document.getElementById('site');
  const err = document.getElementById('err');
  const feed = document.getElementById('feed');
  const esc = s => String(s).replace(/[&<>"]/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  // 「◯分前」を、開いた時刻から計算する
  function ago(iso) {
    if (!iso) return '';
    const t = new Date(iso).getTime();
    if (isNaN(t)) return '';
    const m = Math.max(0, Math.round((Date.now() - t) / 60000));
    if (m < 1) return 'たった今';
    if (m < 60) return m + '分前';
    const h = Math.round(m / 60);
    if (h < 24) return h + '時間前';
    return Math.round(h / 24) + '日前';
  }

  const cats = Object.keys(NEWS.cats);
  let cat = cats[0];

  function row(a, i) {
    return `<a class="art" href="${esc(a.u)}" target="_blank" rel="noopener noreferrer">
      ${i ? `<span class="no">${i}</span>` : ''}
      <div><h3>${esc(a.t)}</h3>
      <div class="meta"><b>${esc(a.s)}</b><span>${ago(a.d)}</span></div></div></a>`;
  }

  function draw() {
    const list = NEWS.cats[cat] || [];
    const top = list[0];
    const rest = list.slice(1);
    // 横の欄には、いま開いていない分野から拾う
    const others = cats.filter(c => c !== cat)
      .flatMap(c => (NEWS.cats[c] || []).slice(0, 2)).slice(0, 7);
    feed.innerHTML =
      (top ? `<a class="lead" href="${esc(top.u)}" target="_blank" rel="noopener noreferrer">
        <h2>${esc(top.t)}</h2>
        <div class="meta"><b>${esc(top.s)}</b><span>${ago(top.d)}</span></div></a>` : '')
      + `<div class="arts">${rest.map(a => row(a, 0)).join('')}</div>`;
    const side = document.getElementById('side');
    side.innerHTML = `<h4>よく読まれている記事</h4>
      <div class="arts">${others.map((a, i) => row(a, i + 1)).join('')}</div>`;
    document.querySelectorAll('.cat').forEach(b =>
      b.setAttribute('aria-selected', String(b.dataset.c === cat)));
  }

  document.getElementById('cats').addEventListener('click', ev => {
    const b = ev.target.closest('.cat');
    if (!b) return;
    cat = b.dataset.c; err.hidden = true; draw();
    window.scrollTo({top: 0, behavior: 'instant'});
  });

  async function decrypt(pw) {
    const enc = JSON.parse(S);
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw),
      'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey(
      {name: 'PBKDF2', salt: b64(enc.s), iterations: enc.n, hash: 'SHA-256'},
      base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(enc.i)}, key, b64(enc.c));
    return new TextDecoder().decode(plain);
  }

  function start(bundle) {
    const b = JSON.parse(bundle);
    document.body.insertAdjacentHTML('beforeend', b.w);
    const p = document.createElement('script');
    p.id = 'payload'; p.type = 'application/json'; p.textContent = b.p;
    document.body.appendChild(p);
    (0, eval)(b.c);
    document.body.classList.remove('locked');
    site.remove();
    if (b.t) { document.title = b.t; }
  }

  async function tryOpen(pw, fromSaved) {
    try {
      start(await decrypt(pw));
      try { localStorage.setItem(KEY, pw); } catch (e) {}
      return true;
    } catch (e) {
      if (!fromSaved) {
        const q = document.getElementById('pw').value;
        err.hidden = false;
        err.innerHTML = `<b>「${esc(q)}」に一致する記事は見つかりませんでした。</b>
          <ul><li>キーワードに誤字・脱字がないか確認してください。</li>
          <li>別のキーワードをお試しください。</li>
          <li>検索できるのは過去30日以内の記事です。</li></ul>`;
      }
      try { if (fromSaved) localStorage.removeItem(KEY); } catch (e2) {}
      return false;
    }
  }

  document.getElementById('lockform').addEventListener('submit', async ev => {
    ev.preventDefault();
    const inp = document.getElementById('pw');
    err.hidden = true;
    inp.blur();
    await tryOpen(inp.value, false);
  });

  draw();
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch (e) {}
  if (saved) { tryOpen(saved, true); }
})();
</script>
